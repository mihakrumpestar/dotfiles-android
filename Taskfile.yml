version: "3"

# Every task runs `go run`, never a built binary: Go exists only inside devenv.
vars:
  APP: ./cmd/androidctl

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  check:
    desc: Format check, vet, tests
    cmds:
      - test -z "$(gofmt -l cmd internal)"
      - go vet ./...
      - go test ./...

  report:
    desc: Every package with the facts that decide a keep/kill call
    cmds:
      - go run {{.APP}} report {{.CLI_ARGS}}

  health:
    desc: Launcher, keyboard, roles, crash buffer
    cmds:
      - go run {{.APP}} health {{.CLI_ARGS}}

  disable:
    desc: "Disable packages from a file: task disable -- policy/packages.txt"
    cmds:
      - go run {{.APP}} disable {{.CLI_ARGS}}

  restore:
    desc: Re-enable everything the newest snapshot recorded as enabled
    cmds:
      - go run {{.APP}} restore {{.CLI_ARGS}}

  obtainium:
    desc: Install Obtainium from its GitHub release, checksum verified
    cmds:
      - go run {{.APP}} obtainium {{.CLI_ARGS}}

  apply:
    desc: Apply profile.conf and apps.conf (dry run unless --yes is in CLI_ARGS)
    cmds:
      - go run {{.APP}} apply {{.CLI_ARGS}}

  verify:
    desc: Report drift between the device and both profiles
    cmds:
      - go run {{.APP}} verify {{.CLI_ARGS}}

  revert:
    desc: Restore the values captured before the last apply
    cmds:
      - go run {{.APP}} revert {{.CLI_ARGS}}

  ui-list:
    desc: List app backup recipes and whether an artifact is stored
    cmds:
      - go run {{.APP}} ui list {{.CLI_ARGS}}

  ui-backup:
    desc: "Export an app's state through its own UI: task ui-backup -- --app <package>"
    cmds:
      - go run {{.APP}} ui backup {{.CLI_ARGS}}

  ui-restore:
    desc: "Restore a stored artifact, guarded: task ui-restore -- --app <package> [--force]"
    cmds:
      - go run {{.APP}} ui restore {{.CLI_ARGS}}

  ui-verify:
    desc: "Compare a fresh export with the stored artifact: task ui-verify -- --app <package>"
    cmds:
      - go run {{.APP}} ui verify {{.CLI_ARGS}}
