version: "3"

# Tasks run from source through devenv, never a built binary. ANDROIDCTL is the
# device command; UIU is the app-backup recipe engine.
vars:
  ANDROIDCTL: uv run androidctl
  UIU: uv run uiu

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  check:
    desc: Format check and tests
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run pytest -q

  report:
    desc: Every package with the facts that decide a keep/kill call
    cmds:
      - "{{.ANDROIDCTL}} report {{.CLI_ARGS}}"

  health:
    desc: Launcher, keyboard, roles, crash buffer
    cmds:
      - "{{.ANDROIDCTL}} health {{.CLI_ARGS}}"

  disable:
    desc: "Disable packages from a file: task disable -- policy/packages.txt"
    cmds:
      - "{{.ANDROIDCTL}} disable {{.CLI_ARGS}}"

  restore:
    desc: Re-enable everything the newest snapshot recorded as enabled
    cmds:
      - "{{.ANDROIDCTL}} restore {{.CLI_ARGS}}"

  init:
    desc: "Install the bootstrap apps and start their services: Shizuku-Next, Obtainium"
    cmds:
      - "{{.ANDROIDCTL}} init {{.CLI_ARGS}}"

  install:
    desc: "Install an app from its release, checksum verified: task install -- <package>"
    cmds:
      - "{{.ANDROIDCTL}} install {{.CLI_ARGS}}"

  apply:
    desc: Apply profile.conf and every app file (dry run unless --yes is in CLI_ARGS)
    cmds:
      - "{{.ANDROIDCTL}} apply {{.CLI_ARGS}}"

  verify:
    desc: Report drift between the device and the declared state
    cmds:
      - "{{.ANDROIDCTL}} verify {{.CLI_ARGS}}"

  revert:
    desc: Restore the values captured before the last apply
    cmds:
      - "{{.ANDROIDCTL}} revert {{.CLI_ARGS}}"

  ui-list:
    desc: List app files and whether an artifact is stored
    cmds:
      - "{{.UIU}} list {{.CLI_ARGS}}"

  ui-backup:
    desc: "Export an app's state through its own UI: task ui-backup -- --app <package>"
    cmds:
      - "{{.UIU}} backup {{.CLI_ARGS}}"

  ui-setup:
    desc: "Run an app's in-app setup walk: task ui-setup -- --app <package>"
    cmds:
      - "{{.UIU}} setup {{.CLI_ARGS}}"

  ui-restore:
    desc: "Restore a stored artifact, guarded: task ui-restore -- --app <package> [--force]"
    cmds:
      - "{{.UIU}} restore {{.CLI_ARGS}}"

  ui-verify:
    desc: "Compare a fresh export with the stored artifact: task ui-verify -- --app <package>"
    cmds:
      - "{{.UIU}} verify {{.CLI_ARGS}}"

  ui-probe:
    desc: "Print the screen as paste-ready selectors: task ui-probe -- --tap '{\"desc\": \"Settings\"}' or --step <recipe step>"
    cmds:
      - "{{.UIU}} probe {{.CLI_ARGS}}"
