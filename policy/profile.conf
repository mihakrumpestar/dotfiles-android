# Declarative device state. Applied by `task apply`, checked by `task verify`,
# undone by `task revert`. Every entry needs a trailing `# reason`.
#
# The section decides the store. `system`, `secure` and `global` go to the
# Settings provider; `telephony` and the other listed DeviceConfig namespaces
# reach DeviceConfig. That split matters because writing a DeviceConfig key
# through `settings put` returns success, creates a row, and changes nothing. It
# is not possible to make that mistake here, since the section selects the
# command.
#
# App scoped state (permissions, app ops, roles, the doze whitelist) lives in
# policy/apps.conf. Both files are applied and verified together by one run.

[system]
# --- sounds and vibration ---
vibrate_when_ringing = "1"                       # vibrate while ringing
haptic_feedback_enabled = "0"                    # touch feedback off
dialing_keypad_vibrate = "0"                     # dialpad haptics off
dtmf_tone = "0"                                  # dialpad tones off
sip_key_feedback_vibration = "0"                 # SIP dialpad haptics off
sip_key_feedback_sound = "0"                     # SIP dialpad tones off
keyboard_vibration_enabled = "1"                 # keyboard haptics on

# Increasing ring volume: the on/off switch is global/apply_ramping_ringer
# below; the ramp durations are DeviceConfig telephony keys at the end of this
# file, because `settings put` cannot reach them.
media_vibration_intensity = "0"                  # media vibration off
notification_vibration_sep_index = "50034"       # keep distinct notification vibration pattern
default_vibration_pattern = "content://com.android.settings.personalvibration.PersonalVibrationProvider/registerinfo/3"  # why: call vibration pattern (dzzz-dzzz is /3)

# --- eye comfort shield: custom schedule, sunset to sunrise, 90% ---
blue_light_filter = "1"                          # eye comfort shield on
blue_light_filter_type = "2"                     # custom schedule
blue_light_filter_opacity = "9"                  # 90% warm
blue_light_filter_scheduled = "1"                # follow the schedule
blue_light_filter_adaptive_mode = "0"            # fixed schedule, not adaptive
blue_light_filter_on_time = "1140"               # 19:00
blue_light_filter_off_time = "420"               # 07:00

# --- lock screen sounds ---
lockscreen_sounds_enabled = "0"                  # no click when unlocking

# --- display ---
# screen_off_timeout is NOT set here: com.elasticrock.keepscreenon (Keep Screen
# On) holds WRITE_SETTINGS and writes Integer.MAX_VALUE so the phone never sleeps
# while it is running. A profile value would be overwritten minutes later and
# report permanent drift. Pre-debloat value was 30000.
time_12_24 = "24"                                # 24 hour clock
aod_mode = "0"                                   # always on display off
screen_brightness_mode = "1"                     # adaptive brightness on

[secure]
# --- lock screen ---
lock_screen_allow_private_notifications = "0"    # hide notification content while locked
lock_screen_allow_private_notifications_when_unsecure = "0"  # why: same, even without a secure lock
notification_history_enabled = "1"               # notification history on
clipboard_show_access_notifications = "1"        # alert when clipboard is accessed
show_notification_category_setting = "1"         # per-channel toggles in Apps > App > Notifications; 0 hides the list entirely

# --- navigation ---
navigation_mode = "2"                            # 2 = swipe gestures
edge_enable = "0"                                # edge panels off
assist_structure_enabled = "0"                   # Circle to Search / assist off
contextual_search_package = ""                   # no contextual search provider

[global]
# --- network ---
private_dns_mode = "opportunistic"               # encrypted DNS when the network supports it, plain DNS otherwise

# --- increasing ring volume (on/off only; the ramp durations are DeviceConfig) ---
apply_ramping_ringer = "1"                       # ramp the ring volume on incoming calls

# --- battery protection ---
protect_battery = "1"                            # battery protection on
battery_protection_threshold = "90"              # stop charging at 90%
battery_protection_recharge_level = "90"         # resume at 90%

# --- animation scales: 0x ---
window_animation_scale = "0.0"                   # 0x, no window animation
transition_animation_scale = "0.0"               # 0x, no transition animation
animator_duration_scale = "0.0"                  # 0x, no animator duration

[telephony]
# Increasing ring volume: 15 second ramp.
ramping_ringer_enabled = "true"                   # ramp the ring volume
ramping_ringer_duration = "15000"                 # 15 second ramp
ramping_ringer_vibration_duration = "15000"       # 15 second vibration ramp
