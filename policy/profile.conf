# Phone settings written from this file. `task apply --yes` writes them,
# `task verify` reports drift, and `task revert` restores the values saved before
# the last apply. Every entry needs a trailing `# reason`.
#
# The section name picks where a value is stored. `system`, `secure` and
# `global` go to the Settings provider (Android's store for system settings).
# `telephony` and the other DeviceConfig namespaces go to DeviceConfig (Android's
# per-feature settings store). The split matters: writing a DeviceConfig key
# with `settings put` reports success, creates a row, and changes nothing. That
# mistake cannot happen here, because the section chooses the command.
#
# Settings that belong to one app live in policy/data/<app>/app.py, one file per
# app, and cover that app's permissions, app ops, roles and doze state. One run
# applies and verifies this file and every app file together.

[system]
# --- sounds and vibration ---
vibrate_when_ringing = "1"                       # vibrate while ringing
haptic_feedback_enabled = "0"                    # touch feedback off
dialing_keypad_vibrate = "0"                     # dialpad haptics off
dtmf_tone = "0"                                  # dialpad tones off
sip_key_feedback_vibration = "0"                 # SIP dialpad haptics off
sip_key_feedback_sound = "0"                     # SIP dialpad tones off
keyboard_vibration_enabled = "1"                 # keyboard haptics on

# Increasing ring volume: the on/off switch is global/apply_ramping_ringer
# below. The ramp durations are telephony keys in DeviceConfig at the end of this
# file, because `settings put` cannot reach DeviceConfig.
media_vibration_intensity = "0"                  # media vibration off
notification_vibration_sep_index = "50034"       # separate notification vibration pattern
default_vibration_pattern = "content://com.android.settings.personalvibration.PersonalVibrationProvider/registerinfo/3"  # call vibration pattern; dzzz-dzzz is /3

# --- eye comfort shield: custom schedule, 19:00 to 07:00, 90% warm ---
blue_light_filter = "1"                          # eye comfort shield on
blue_light_filter_type = "2"                     # custom schedule
blue_light_filter_opacity = "9"                  # 90% warm
blue_light_filter_scheduled = "1"                # follow the schedule
blue_light_filter_adaptive_mode = "0"            # fixed schedule, not adaptive
blue_light_filter_on_time = "1140"               # 19:00
blue_light_filter_off_time = "420"               # 07:00

# --- lock screen sounds ---
lockscreen_sounds_enabled = "0"                  # no click when unlocking

# --- display ---
# screen_off_timeout is NOT set here. com.elasticrock.keepscreenon (Keep Screen
# On) holds WRITE_SETTINGS, the permission to change system settings, and writes
# Integer.MAX_VALUE so the phone never sleeps while the app runs. A value here
# would be overwritten minutes later and then show up as permanent drift. Before
# the preinstalled apps were removed, this was 30000 (30 seconds).
time_12_24 = "24"                                # 24 hour clock
aod_mode = "0"                                   # always on display off
screen_brightness_mode = "1"                     # adaptive brightness on

[secure]
# --- lock screen ---
lock_screen_allow_private_notifications = "0"    # hide notification content while locked
lock_screen_allow_private_notifications_when_unsecure = "0"  # hide content too when the lock is not secure
notification_history_enabled = "1"               # notification history on
clipboard_show_access_notifications = "1"        # alert when clipboard is accessed
show_notification_category_setting = "1"         # per-channel toggles in Apps > App > Notifications; 0 hides the list entirely

# --- navigation ---
navigation_mode = "2"                            # 2 = swipe gestures
edge_enable = "0"                                # edge panels off
assist_structure_enabled = "0"                   # Circle to Search / assist off
contextual_search_package = ""                   # no contextual search provider
# Services that need explicit user enablement. The colon-separated list is the
# whole setting, so every entry the phone needs must be here.
enabled_accessibility_services = "org.kde.kdeconnect_tp/org.kde.kdeconnect.KdeConnectAccessibilityService:com.mindful.android/.services.accessibility.MindfulAccessibilityService"  # KDE Connect and Mindful
enabled_notification_listeners = "org.kde.kdeconnect_tp/org.kde.kdeconnect.plugins.notifications.NotificationReceiver:com.sec.android.app.launcher/com.android.launcher3.notification.NotificationListener:com.samsung.android.smartmirroring/com.samsung.android.smartmirroring.controller.NotificationService:com.mindful.android/.services.notification.MindfulNotificationListenerService"  # notification access, including the Samsung launcher

[global]
# --- network ---
private_dns_mode = "opportunistic"               # encrypted DNS when the network supports it, plain DNS otherwise

# --- increasing ring volume (on/off only; the ramp durations live in DeviceConfig) ---
apply_ramping_ringer = "1"                       # ramp the ring volume on incoming calls

# --- battery protection ---
protect_battery = "1"                            # battery protection on
battery_protection_threshold = "90"              # stop charging at 90%
battery_protection_recharge_level = "90"         # start charging again at 90%

# --- animation scales: 0 (no animation) ---
window_animation_scale = "0.0"                   # window animations off
transition_animation_scale = "0.0"               # transition animations off
animator_duration_scale = "0.0"                  # animator duration off

[telephony]
# Increasing ring volume, stored in DeviceConfig: a 15 second ramp. Times are in
# milliseconds.
ramping_ringer_enabled = "true"                   # ramp the ring volume
ramping_ringer_duration = "15000"                 # 15 second ramp
ramping_ringer_vibration_duration = "15000"       # 15 second vibration ramp
