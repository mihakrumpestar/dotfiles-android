# App scoped device state. Applied by the same `task apply` as profile.conf, in a
# single run with a single snapshot, so `task verify` and `task revert` cover
# both files.
#
# These sections name the package in the key, and an entry whose package is not
# installed for user 0 is skipped and counted, so one file still covers both
# phones.

[permissions]
# ShizuCallRecorder: what it reads to decide a call is a call and who is on it.
com.kitsumed.shizucallrecorder:android.permission.READ_CALL_LOG = "granted"       # identify incoming and outgoing calls
com.kitsumed.shizucallrecorder:android.permission.READ_PHONE_STATE = "granted"     # follow call state changes
com.kitsumed.shizucallrecorder:android.permission.READ_CONTACTS = "granted"        # name recordings after the contact
com.kitsumed.shizucallrecorder:android.permission.POST_NOTIFICATIONS = "granted"   # show the recording that is running
# Shizuku: mDNS discovery of the wireless debugging port. This is a runtime
# permission, not an app op: granting the op alone leaves the permission denied
# and the scan still fails.
moe.shizuku.privileged.api:android.permission.NEARBY_WIFI_DEVICES = "granted"      # see the pairing and connect services
# Aves: the gallery reads the media store, so it needs the media permissions
# rather than storage. Without them it shows an empty library.
deckers.thibault.aves.libre:android.permission.READ_MEDIA_IMAGES = "granted"       # show photos in the gallery
deckers.thibault.aves.libre:android.permission.READ_MEDIA_VIDEO = "granted"        # show videos in the gallery

[appops]
# Shizuku: hiding lists need the foreground app, and the server outlives the
# manager. Both default to allow, so these pin the default rather than change it.
moe.shizuku.privileged.api:GET_USAGE_STATS = "allow"            # hiding lists need the foreground app
moe.shizuku.privileged.api:RUN_ANY_IN_BACKGROUND = "allow"      # the server outlives the manager
# ShizuCallRecorder: takes over the ongoing call to capture it.
com.kitsumed.shizucallrecorder:MANAGE_ONGOING_CALLS = "allow"   # record the call in progress

[role]
# One package per role. The platform evicts the current holder when another is
# added, so a list here would leave only the last one in place.
android.app.role.HOME = "eu.ottop.yamlauncher"                  # Yam Launcher is the home screen
android.app.role.DIALER = "org.fossify.phone"                   # Fossify Phone
android.app.role.SMS = "org.fossify.messages"                   # Fossify Messages
android.app.role.BROWSER = "org.ironfoxoss.ironfox"             # IronFox, set as default in setup

[deviceidle]
# Doze whitelist. These are the packages that have to keep running while the
# phone sleeps: everything else on the phone can be frozen.
moe.shizuku.privileged.api = "allow"        # the server must be up when the first ring arrives
com.kitsumed.shizucallrecorder = "allow"    # the recorder has to run while the phone sleeps
app.revanced.android.gms = "allow"          # MicroG keeps the YouTube replacement signed in
de.felixnuesse.extract = "allow"            # Round Sync copies backups on schedule
