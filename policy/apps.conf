# State that belongs to one app rather than the whole phone. `task apply --yes`
# writes this file and profile.conf in one run. It saves one snapshot of the
# changed values first. `task verify` and `task revert` then cover both files.
#
# Each key starts with the package (the app's unique id). An entry whose package
# is not installed for user 0 (the phone's main user) is skipped and counted, so
# one file still covers both phones.

[permissions]
# A permission is a capability the system grants an app. ShizuCallRecorder reads
# these to tell that a call is a call and to know who is on it.
com.kitsumed.shizucallrecorder:android.permission.READ_CALL_LOG = "granted"       # identify incoming and outgoing calls
com.kitsumed.shizucallrecorder:android.permission.READ_PHONE_STATE = "granted"     # follow call state changes
com.kitsumed.shizucallrecorder:android.permission.READ_CONTACTS = "granted"        # name recordings after the contact
com.kitsumed.shizucallrecorder:android.permission.POST_NOTIFICATIONS = "granted"   # show that a recording is running
# Shizuku: finds the wireless debugging port through mDNS, which is name
# discovery on the local network. This is a runtime permission, granted after
# install, not an app op (a per-app switch kept apart from permissions): setting
# the op alone leaves the permission denied and the scan still fails.
moe.shizuku.privileged.api:android.permission.NEARBY_WIFI_DEVICES = "granted"      # find the wireless debugging service on the network
# Aves: the gallery reads the media store (Android's index of photos and videos),
# so it needs the media permissions instead of the old broad storage one. Without
# them the library shows empty.
deckers.thibault.aves.libre:android.permission.READ_MEDIA_IMAGES = "granted"       # show photos in the gallery
deckers.thibault.aves.libre:android.permission.READ_MEDIA_VIDEO = "granted"        # show videos in the gallery

[appops]
# App ops for Shizuku: its hiding lists need the foreground app (the one on
# screen), and its server keeps running after the manager closes. Both ops
# already default to allow, so these entries pin the default instead of changing
# it.
moe.shizuku.privileged.api:GET_USAGE_STATS = "allow"            # hiding lists need the foreground app
moe.shizuku.privileged.api:RUN_ANY_IN_BACKGROUND = "allow"      # the server outlives the manager
# ShizuCallRecorder: takes over the call in progress so it can record it.
com.kitsumed.shizucallrecorder:MANAGE_ONGOING_CALLS = "allow"   # record the call in progress

[role]
# A role is a system job that one app holds, such as the home screen. Android
# removes the current holder when another app is added, so a list here would
# leave only the last package in place.
android.app.role.HOME = "eu.ottop.yamlauncher"                  # Yam Launcher is the home screen
android.app.role.DIALER = "org.fossify.phone"                   # Fossify Phone
android.app.role.SMS = "org.fossify.messages"                   # Fossify Messages
android.app.role.BROWSER = "org.ironfoxoss.ironfox"             # IronFox, set as default in setup

[deviceidle]
# Doze whitelist: packages allowed to keep running while the phone is in Doze,
# its deep sleep mode. Every other app can be frozen there.
moe.shizuku.privileged.api = "allow"        # the server must be up when the first ring arrives
com.kitsumed.shizucallrecorder = "allow"    # the recorder has to run while the phone sleeps
app.revanced.android.gms = "allow"          # MicroG keeps the YouTube replacement signed in
de.felixnuesse.extract = "allow"            # Round Sync copies backups on a schedule
