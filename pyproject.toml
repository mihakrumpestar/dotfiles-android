[project]
name = "uiu"
version = "0.1.0"
description = "Replay declarative Android UI recipes through uiautomator2"
requires-python = ">=3.13"
dependencies = ["uiautomator2>=3.2"]

[project.scripts]
uiu = "uiu.cli:main"
androidctl = "androidctl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uiu", "androidctl"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
# Standard mode: pyright's basic rules, plus the optional-access and argument
# checks that caught real bugs here. It skips the strict-only rules that flag
# every value that came out of JSON.
include = ["uiu", "androidctl", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
# The tests import `support` as a sibling module, the way pytest puts the tests
# directory on the path. The checker needs the same directory to resolve it.
extraPaths = ["tests"]
